[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under /assets; Netlify otherwise revalidates
# every file on every visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must be checked on every load, or a deploy can take a day
# to reach consoles that already hold the old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
